apiVersion: v1
kind: Pod
metadata:
  name: hami-demo-gpu
spec:
  schedulerName: hami-scheduler
  nodeSelector:{{ toYaml .Values.gpu.nodeSelector | nindent 4 }}
  containers:
    - name: cuda
      image: {{ .Values.image | quote }}
      command: ["sleep", "infinity"]
      resources:
        limits:
          nvidia.com/gpu: "1"
          nvidia.com/gpumem: {{ .Values.gpu.memoryMiB | quote }}
